<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Iron hall weight room illustration">
  <rect width="600" height="400" fill="#10141C"/>
  <rect y="300" width="600" height="100" fill="#0A0D12"/>
  <g stroke="#C8FF3D" stroke-width="2" opacity="0.15">
    <line x1="0" y1="60" x2="600" y2="60"/><line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/><line x1="0" y1="240" x2="600" y2="240"/>
  </g>
  <!-- squat rack -->
  <g fill="#232B3B">
    <rect x="80" y="90" width="18" height="220"/><rect x="502" y="90" width="18" height="220"/>
    <rect x="80" y="90" width="440" height="16"/>
  </g>
  <rect x="250" y="130" width="100" height="10" fill="#C8FF3D"/>
  <circle cx="220" cy="135" r="26" fill="#2E3749"/><circle cx="380" cy="135" r="26" fill="#2E3749"/>
  <circle cx="220" cy="135" r="10" fill="#0A0C10"/><circle cx="380" cy="135" r="10" fill="#0A0C10"/>
  <!-- dumbbell rack -->
  <g>
    <rect x="120" y="270" width="360" height="14" fill="#232B3B"/>
    <g fill="#3A4356">
      <rect x="150" y="238" width="54" height="32" rx="6"/><rect x="230" y="238" width="54" height="32" rx="6"/>
      <rect x="310" y="238" width="54" height="32" rx="6"/><rect x="390" y="238" width="54" height="32" rx="6"/>
    </g>
    <g fill="#C8FF3D" opacity="0.8">
      <rect x="172" y="246" width="10" height="16"/><rect x="252" y="246" width="10" height="16"/>
      <rect x="332" y="246" width="10" height="16"/><rect x="412" y="246" width="10" height="16"/>
    </g>
  </g>
  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" letter-spacing="8" fill="#C8FF3D">IRON HALL</text>
</svg>
