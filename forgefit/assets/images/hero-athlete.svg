<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Abstract athlete lifting a barbell">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A212E"/><stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8FF5C"/><stop offset="1" stop-color="#A8D92B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#hg)"/>
  <circle cx="300" cy="330" r="230" fill="#131822"/>
  <circle cx="300" cy="330" r="230" fill="none" stroke="#C8FF3D" stroke-width="2" opacity="0.35"/>
  <circle cx="300" cy="330" r="262" fill="none" stroke="#C8FF3D" stroke-width="1" opacity="0.15" stroke-dasharray="6 10"/>
  <polygon points="120,700 300,120 360,120 180,700" fill="#C8FF3D" opacity="0.07"/>
  <polygon points="380,700 560,120 590,120 410,700" fill="#FF5A2E" opacity="0.08"/>
  <!-- barbell -->
  <rect x="70" y="196" width="460" height="14" rx="7" fill="url(#vg)"/>
  <rect x="110" y="150" width="26" height="106" rx="6" fill="#2A3345"/>
  <rect x="142" y="162" width="26" height="82" rx="6" fill="#2A3345"/>
  <rect x="464" y="150" width="26" height="106" rx="6" fill="#2A3345"/>
  <rect x="432" y="162" width="26" height="82" rx="6" fill="#2A3345"/>
  <circle cx="300" cy="203" r="6" fill="#0A0C10"/>
  <!-- athlete figure: overhead press, geometric -->
  <g fill="#E8ECF2">
    <circle cx="300" cy="330" r="34"/>
    <polygon points="300,366 246,470 268,470 300,410 332,470 354,470"/>
    <polygon points="262,478 232,560 258,560 282,486"/>
    <polygon points="338,478 368,560 342,560 318,486"/>
    <rect x="238" y="560" width="52" height="16" rx="6"/>
    <rect x="342" y="560" width="52" height="16" rx="6"/>
  </g>
  <g stroke="#E8ECF2" stroke-width="26" stroke-linecap="round">
    <line x1="286" y1="392" x2="196" y2="238"/>
    <line x1="314" y1="392" x2="404" y2="238"/>
  </g>
  <g fill="#C8FF3D">
    <circle cx="192" cy="232" r="15"/><circle cx="408" cy="232" r="15"/>
  </g>
  <!-- torso accent -->
  <polygon points="282,392 318,392 326,470 274,470" fill="#C8FF3D" opacity="0.9"/>
  <text x="300" y="648" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" fill="#C8FF3D" letter-spacing="6">FORGE</text>
  <text x="300" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9AA3B2" letter-spacing="10">STRENGTH CLUB</text>
</svg>
